# نشر يدوي من GitHub: Actions ← Deploy ← Run workflow (لا ينشر تلقائياً)
# يحتاج سر واسمه FIREBASE_SERVICE_ACCOUNT (انظر README ← GitHub)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'ماذا تنشر'
        required: true
        default: 'firestore,hosting'
        type: choice
        options:
          - 'firestore,hosting'
          - 'hosting'
          - 'firestore'
          - 'storage'
          - 'functions'
          - 'firestore,hosting,storage,functions'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install -g firebase-tools
      - name: الفحص والاختبارات أولاً — لا نشر إذا فشلت
        run: npm run check && npm test
      - name: تثبيت مكتبات الدوال
        if: contains(inputs.what, 'functions')
        run: npm --prefix functions install --no-audit --no-fund
      - name: النشر
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WHAT: ${{ inputs.what }}
        run: |
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only "$WHAT" --project mohammad-jasm --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
