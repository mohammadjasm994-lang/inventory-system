# فحص تلقائي عند كل رفع أو طلب دمج: سلامة الملفات + اختبارات قواعد الحماية على المحاكي
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install -g firebase-tools
      - name: فحص الملفات
        run: npm run check
      - name: اختبارات قواعد الحماية (Firestore + Storage)
        run: npm test
